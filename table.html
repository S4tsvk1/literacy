<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>罫線ありの表</title>

  <style>
    table {
      border-collapse: collapse; /* 線を1本にまとめる */
      width: 70%;
      margin: 20px auto;
    }

    th, td {
      border: 2px solid black; /* ← 罫線 */
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: lightblue;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <th>名前</th>
      <th>学年</th>
      <th>好きなゲーム</th>
    </tr>

    <tr>
      <td>田中</td>
      <td>1年</td>
      <td>スプラトゥーン</td>
    </tr>

    <tr>
      <td>佐藤</td>
      <td>2年</td>
      <td>マイクラ</td>
    </tr>

    <tr>
      <td>鈴木</td>
      <td>3年</td>
      <td>VALORANT</td>
    </tr>
  </table>

</body>
</html>
